# fly.toml app configuration file generated for absenceplanning on 2026-11-16T15:16:18+01:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'absenceplanning'
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
